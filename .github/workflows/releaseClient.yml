name: release client

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: github.repository == 'jespertheend/splix'
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@93ea575cb5d8a053eaa0ac8fa3b40d7e05a33cc8

      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: v2.4.1

      - name: Install Dependencies
        run: deno task install-deps

      - name: Release client
        env:
          PELICAN_PARTY_GAMES_UPLOAD_TOKEN: ${{ secrets.PELICAN_PARTY_GAMES_UPLOAD_TOKEN }}
        run: deno task release-client ${{ github.sha }}
